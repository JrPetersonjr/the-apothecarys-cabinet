<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldVine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d8b056"/>
      <stop offset="100%" stop-color="#9e7828"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5fa375"/>
      <stop offset="100%" stop-color="#234a31"/>
    </linearGradient>
  </defs>
  
  <!-- Main Arching Stem -->
  <path d="M 10 190 C 20 120 50 60 120 30 C 150 18 180 12 195 10" fill="none" stroke="url(#goldVine)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Secondary Twisting Tendril -->
  <path d="M 35 150 C 60 130 90 125 105 100 C 115 80 110 55 130 45" fill="none" stroke="url(#goldVine)" stroke-width="1.5" stroke-dasharray="100" stroke-dashoffset="0"/>
  <!-- Curly Tendril Swirls -->
  <path d="M 80 60 C 95 40 120 50 115 65 C 110 75 95 70 100 60" fill="none" stroke="#d8b056" stroke-width="1.2"/>
  <path d="M 150 22 C 165 10 185 20 180 35 C 175 45 160 40 165 30" fill="none" stroke="#d8b056" stroke-width="1.2"/>

  <!-- Ivy & Botanical Leaves -->
  <!-- Leaf 1 (bottom left) -->
  <path d="M 22 140 C 5 130 0 110 15 115 C 30 120 30 135 22 140 Z" fill="url(#leafGrad)" stroke="#c2983b" stroke-width="0.8"/>
  <path d="M 15 115 Q 22 128 22 140" fill="none" stroke="#d8b056" stroke-width="0.5"/>
  <!-- Leaf 2 (mid stem) -->
  <path d="M 55 95 C 40 75 45 55 65 65 C 80 75 70 95 55 95 Z" fill="url(#leafGrad)" stroke="#c2983b" stroke-width="0.8"/>
  <path d="M 65 65 Q 60 80 55 95" fill="none" stroke="#d8b056" stroke-width="0.5"/>
  <!-- Leaf 3 (top right) -->
  <path d="M 125 35 C 120 15 135 5 150 20 C 160 35 140 45 125 35 Z" fill="url(#leafGrad)" stroke="#c2983b" stroke-width="0.8"/>
  <path d="M 150 20 Q 138 28 125 35" fill="none" stroke="#d8b056" stroke-width="0.5"/>
  <!-- Leaf 4 (far tip) -->
  <path d="M 175 14 C 185 2 198 5 198 18 C 195 28 185 25 175 14 Z" fill="url(#leafGrad)" stroke="#c2983b" stroke-width="0.8"/>
  
  <!-- Tiny Nightshade / Belladonna Berries -->
  <circle cx="108" cy="92" r="3.5" fill="#582a38" stroke="#d8b056" stroke-width="0.8"/>
  <circle cx="116" cy="98" r="2.8" fill="#421a28" stroke="#d8b056" stroke-width="0.8"/>
  <circle cx="170" cy="38" r="3" fill="#582a38" stroke="#d8b056" stroke-width="0.8"/>
</svg>