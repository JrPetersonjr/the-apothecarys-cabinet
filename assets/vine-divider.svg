<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="100%" height="60">
  <defs>
    <linearGradient id="goldDiv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="25%" stop-color="#c2983b" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#f5d77f"/>
      <stop offset="75%" stop-color="#c2983b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  
  <!-- Center Moon Phase & Sacred Star -->
  <g transform="translate(400, 30)">
    <!-- Full Moon with botanical aura -->
    <circle cx="0" cy="0" r="14" fill="#14241b" stroke="#d8b056" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="11" fill="none" stroke="#c2983b" stroke-width="0.8" stroke-dasharray="3 2"/>
    <!-- Waxing crescent left -->
    <path d="M -26 -8 A 10 10 0 0 1 -26 8 A 8 8 0 0 0 -26 -8 Z" fill="#d8b056"/>
    <!-- Waning crescent right -->
    <path d="M 26 -8 A 10 10 0 0 0 26 8 A 8 8 0 0 1 26 -8 Z" fill="#d8b056"/>
    <!-- Botanical Accent Stars -->
    <polygon points="0,-22 3,-17 0,-12 -3,-17" fill="#f5d77f"/>
    <polygon points="0,22 3,17 0,12 -3,17" fill="#f5d77f"/>
  </g>

  <!-- Left Vine branch -->
  <path d="M 120 30 C 180 20 240 40 310 26 C 340 20 360 30 370 30" fill="none" stroke="url(#goldDiv)" stroke-width="1.8"/>
  <path d="M 220 28 Q 235 15 250 22 Q 235 30 220 28" fill="#386146" stroke="#c2983b" stroke-width="0.8"/>
  <path d="M 285 28 Q 300 12 315 20 Q 300 32 285 28" fill="#386146" stroke="#c2983b" stroke-width="0.8"/>
  <circle cx="258" cy="18" r="2.5" fill="#f5d77f"/>

  <!-- Right Vine branch -->
  <path d="M 680 30 C 620 20 560 40 490 26 C 460 20 440 30 430 30" fill="none" stroke="url(#goldDiv)" stroke-width="1.8"/>
  <path d="M 580 28 Q 565 15 550 22 Q 565 30 580 28" fill="#386146" stroke="#c2983b" stroke-width="0.8"/>
  <path d="M 515 28 Q 500 12 485 20 Q 500 32 515 28" fill="#386146" stroke="#c2983b" stroke-width="0.8"/>
  <circle cx="542" cy="18" r="2.5" fill="#f5d77f"/>
</svg>