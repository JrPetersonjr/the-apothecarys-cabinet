<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="100%" height="100%" fill="#1a2620"/>
  <circle cx="200" cy="200" r="150" fill="#22332a" stroke="#b68b32" stroke-width="1.5" stroke-dasharray="8 4"/>
  <circle cx="200" cy="200" r="135" fill="#16231c"/>
  
  <!-- Wooden Gift Crate (Rustic Cedar / Pine) -->
  <rect x="120" y="160" width="160" height="120" rx="6" fill="#8f5b30" stroke="#c9955d" stroke-width="2"/>
  <!-- Slat lines -->
  <line x1="120" y1="200" x2="280" y2="200" stroke="#5c381c" stroke-width="2"/>
  <line x1="120" y1="240" x2="280" y2="240" stroke="#5c381c" stroke-width="2"/>
  
  <!-- Lid -->
  <rect x="110" y="140" width="180" height="24" rx="4" fill="#a66e3c" stroke="#d6a774" stroke-width="2"/>
  
  <!-- Tied Botanical Twine & Wax Seal -->
  <line x1="200" y1="140" x2="200" y2="280" stroke="#d5b364" stroke-width="3"/>
  <circle cx="200" cy="185" r="16" fill="#8a2020" stroke="#5a1010" stroke-width="1.5"/>
  <text x="200" y="190" text-anchor="middle" font-family="serif" font-size="12" font-weight="bold" fill="#f5d77f">L</text>
  
  <!-- Tag -->
  <polygon points="215,195 245,210 240,230 210,215" fill="#f7f1e4" stroke="#87755a" stroke-width="1"/>
  <text x="228" y="218" text-anchor="middle" font-family="serif" font-size="5" fill="#222" transform="rotate(25 228 218)">FOR YOU</text>
  
  <text x="200" y="265" text-anchor="middle" font-family="serif" font-size="8" font-weight="bold" fill="#fae8c8" letter-spacing="1">CUSTOM GIFT CRATE</text>
  <text x="200" y="274" text-anchor="middle" font-family="monospace" font-size="6" fill="#d9b68b">MADE TO ORDER • CHOOSE SCENTS</text>
</svg>