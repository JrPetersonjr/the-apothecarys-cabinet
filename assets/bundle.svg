<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="100%" height="100%" fill="#1a2620"/>
  <circle cx="200" cy="200" r="150" fill="#22332a" stroke="#b68b32" stroke-width="1.5" stroke-dasharray="8 4"/>
  <circle cx="200" cy="200" r="135" fill="#16231c"/>
  <!-- Botanical Smudge Wand / Bundle -->
  <g transform="rotate(-35 200 200)">
    <rect x="175" y="100" width="50" height="200" rx="20" fill="#4d6951" stroke="#334736" stroke-width="2"/>
    <!-- Twine wrapping -->
    <line x1="175" y1="120" x2="225" y2="150" stroke="#d5b364" stroke-width="2.5"/>
    <line x1="175" y1="150" x2="225" y2="120" stroke="#d5b364" stroke-width="2.5"/>
    <line x1="175" y1="170" x2="225" y2="200" stroke="#d5b364" stroke-width="2.5"/>
    <line x1="175" y1="200" x2="225" y2="170" stroke="#d5b364" stroke-width="2.5"/>
    <line x1="175" y1="220" x2="225" y2="250" stroke="#d5b364" stroke-width="2.5"/>
    <line x1="175" y1="250" x2="225" y2="220" stroke="#d5b364" stroke-width="2.5"/>
    <!-- Leaf textures -->
    <path d="M170 110 Q190 90 200 105" fill="#698f70"/>
    <path d="M230 110 Q210 90 200 105" fill="#698f70"/>
  </g>
  <!-- Smoke swirl -->
  <path d="M260 140 Q280 110 270 90 T290 60" fill="none" stroke="rgba(240,240,230,0.4)" stroke-width="3" stroke-linecap="round"/>
</svg>