  </g>
  <text x="200" y="235" text-anchor="middle" font-family="serif" font-size="8" font-weight="bold" fill="#d8b056" letter-spacing="2">THE APOTHECARY'S CABINET</text>
  <text x="200" y="248" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#88a892">THE APOTHECARY'S CABINET • EST. 2018</text>
