<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="serum-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdfbf7" stop-opacity="1" />
      <stop offset="100%" stop-color="#eae5d8" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="amber-glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a2e12" />
      <stop offset="25%" stop-color="#b86928" />
      <stop offset="50%" stop-color="#e08a38" />
      <stop offset="75%" stop-color="#8c4415" />
      <stop offset="100%" stop-color="#3d1b08" />
    </linearGradient>
    <linearGradient id="gold-collar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a6d2b" />
      <stop offset="50%" stop-color="#f5d77f" />
      <stop offset="100%" stop-color="#73591f" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#1b2a1e" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="185" fill="url(#serum-glow)" stroke="#c2983b" stroke-width="2" stroke-opacity="0.4" />

  <!-- Botanical Rose & Rosemary Sprigs Behind -->
  <g stroke="#4a634e" stroke-width="2.5" fill="none" opacity="0.6">
    <path d="M120 280 Q100 210 130 150 Q145 120 160 100" />
    <path d="M120 210 Q95 195 105 180 Q120 190 125 200" fill="#69856d" opacity="0.7" />
    <path d="M132 170 Q110 155 120 140 Q135 150 138 160" fill="#69856d" opacity="0.7" />
    <path d="M280 280 Q300 210 270 150 Q255 120 240 100" />
    <path d="M280 210 Q305 195 295 180 Q280 190 275 200" fill="#69856d" opacity="0.7" />
    <path d="M268 170 Q290 155 280 140 Q265 150 262 160" fill="#69856d" opacity="0.7" />
  </g>

  <!-- Grounding shadow -->
  <ellipse cx="200" cy="335" rx="65" ry="14" fill="#000" opacity="0.25" filter="blur(6px)" />

  <!-- Dropper Pipette Bulb (White/Cream Rubber) -->
  <g filter="url(#shadow)">
    <path d="M188 75 C188 62 193 54 200 54 C207 54 212 62 212 75 L214 96 L186 96 Z" fill="#f4efe6" stroke="#c5bcab" stroke-width="1.5" />
    
    <!-- Gold Pipette Cap/Collar -->
    <rect x="180" y="96" width="40" height="22" rx="2" fill="url(#gold-collar)" stroke="#5c4515" stroke-width="1" />
    <line x1="180" y1="107" x2="220" y2="107" stroke="#fff" stroke-width="0.8" opacity="0.6" />

    <!-- Amber Bottle Neck -->
    <rect x="185" y="118" width="30" height="14" fill="url(#amber-glass)" />

    <!-- Bottle Shoulder & Main Body -->
    <path d="M185 132 C165 136 150 152 150 174 L150 305 C150 318 160 326 175 326 L225 326 C240 326 250 318 250 305 L250 174 C250 152 235 136 215 132 Z" fill="url(#amber-glass)" stroke="#2b1204" stroke-width="2" />

    <!-- Glass Highlights -->
    <path d="M158 178 L158 300" stroke="#ffebc2" stroke-width="4" stroke-linecap="round" opacity="0.45" />
    <path d="M165 174 L165 304" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />

    <!-- Vintage Botanical Label -->
    <rect x="162" y="180" width="76" height="110" rx="3" fill="#fdfbf7" stroke="#c2983b" stroke-width="1.2" />
    <rect x="165" y="183" width="70" height="104" rx="2" fill="none" stroke="#2b3d30" stroke-width="0.6" stroke-dasharray="3,2" />

    <text x="200" y="200" text-anchor="middle" font-family="serif" font-size="8" font-weight="bold" fill="#1b2a1e" letter-spacing="1.2">HERBAL</text>
    <text x="200" y="213" text-anchor="middle" font-family="serif" font-size="7" font-weight="bold" fill="#8c4415" letter-spacing="1">FACE SERUM</text>
    
    <line x1="175" y1="220" x2="225" y2="220" stroke="#c2983b" stroke-width="0.8" />
    
    <text x="200" y="232" text-anchor="middle" font-family="sans-serif" font-size="4.8" fill="#444">Rose &amp; Chamomile</text>
    <text x="200" y="241" text-anchor="middle" font-family="sans-serif" font-size="4.8" fill="#444">Hyaluronic Acid</text>
    <text x="200" y="250" text-anchor="middle" font-family="sans-serif" font-size="4.2" font-style="italic" fill="#69856d">Pure Botanical Hydration</text>
    
    <circle cx="200" cy="264" r="7" fill="#1b2a1e" />
    <text x="200" y="267" text-anchor="middle" font-family="serif" font-size="6" fill="#f5d77f">AC</text>

    <text x="200" y="281" text-anchor="middle" font-family="monospace" font-size="4.5" fill="#555">30 ml • 1 fl oz</text>
  </g>
</svg>